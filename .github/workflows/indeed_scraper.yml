name: Indeed Job Scraper

on:
  schedule:
     #- cron: '0 4 * * *'  # Runs every day at 5 AM GMT+1 (4 AM UTC)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9.12'

      # 3️⃣ Install Chrome, ChromeDriver, Xvfb, VNC, and Node.js
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb x11vnc novnc nodejs npm
          sudo npm install -g localtunnel
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb
          DRIVER_VERSION=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE")
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${DRIVER_VERSION}/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          rm -rf chromedriver-linux64*

      # 4️⃣ Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pandas gspread google-auth

      # 5️⃣ Start Display, VNC Server, and Expose Public Web Link
      - name: Start Web VNC & Expose Public URL
        run: |
          # 1. Start Virtual Framebuffer
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2

          # 2. Start VNC Server
          x11vnc -display :99 -forever -shared -rfbport 5900 -nopw &

          # 3. Start noVNC Web Interface on Port 8080
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 8080 &
          sleep 3

          # 4. Get Public IP (Used as Localtunnel password if prompted)
          PUBLIC_IP=$(curl -s https://loca.lt/mytunnelpassword)
          
          # 5. Launch Localtunnel and print the direct clickable URL to the console logs
          echo "================================================================="
          echo "🌐 YOUR DIRECT BROWSER GUI LINK IS GENERATING BELOW:"
          echo "🔑 TUNNEL PASSWORD (IF PROMPTED): $PUBLIC_IP"
          echo "================================================================="
          lt --port 8080 &
          sleep 5

      # 6️⃣ Run Indeed Scraper on Display :99
      - name: Run Indeed Scraper
        env:
          DISPLAY: ":99"
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
        run: python app2.py

      # 7️⃣ Upload Screenshots
      - name: Upload Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indeed-scraping-screenshots
          path: screenshots/
          if-no-files-found: ignore
