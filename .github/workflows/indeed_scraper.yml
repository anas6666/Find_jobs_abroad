name: Indeed Job Scraper

on:
  schedule:
     - cron: '0 4 * * *'  # Runs every day at 5 AM GMT+1 (4 AM UTC)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9.12'

      # 3️⃣ Install Chrome, ChromeDriver, Xvfb, tmate, and VNC tools
      - name: Install Chrome, ChromeDriver and VNC Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb tmate x11vnc novnc
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb
          DRIVER_VERSION=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE")
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${DRIVER_VERSION}/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          rm -rf chromedriver-linux64*

      # 4️⃣ Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pandas gspread google-auth

      # 5️⃣ Setup tmate background session (Option 1)
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: false

      # 6️⃣ Start Web VNC Proxy (Option 2)
      - name: Start Web VNC Proxy
        run: |
          # Start virtual display screen on :99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          # Start x11vnc server pointing to display :99
          x11vnc -display :99 -forever -shared -rfbport 5900 -nopw &
          # Start noVNC web interface on port 8080
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 8080 &

      # 7️⃣ Run Indeed Scraper on Virtual Display :99
      - name: Run Indeed Scraper
        env:
          DISPLAY: ":99"
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
        run: python app2.py

      # 8️⃣ Upload Screenshots Artifact
      - name: Upload Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indeed-scraping-screenshots
          path: screenshots/
          if-no-files-found: ignore
