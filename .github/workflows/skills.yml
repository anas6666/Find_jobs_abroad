name: Skills Scraper

on:
  workflow_dispatch:

  schedule:
    # Every day at 06:00 UTC
    #- cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4 lxml gspread

      - name: Run scraper
        run: |
          python skills.py

      - name: Check generated file
        run: |
          ls -lah
          test -f linkedin_jobs_fde.xlsx

      - name: Upload Excel as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-jobs-fde
          path: linkedin_jobs_fde.xlsx
          retention-days: 30
