name: skills Scraper

on:
  workflow_dispatch:

  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          pip install openpyxl
          pip install requests
          pip install beautifulsoup4
          pip install lxml
          pip install gspread
          pip install google-auth

      # Only needed if you use Google Sheets
      - name: Create Google credentials
        if: ${{ secrets.GOOGLE_CREDENTIALS != '' }}
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Run scraper
        run: |
          python skills.py

      - name: Verify output
        run: |
          ls -R
          test -f linkedin_jobs.xlsx

      - name: Commit updated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions.noreply.github.com"

          git add linkedin_jobs.xlsx

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update LinkedIn jobs ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
